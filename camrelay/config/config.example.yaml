# Example configuration. Copy to /etc/camrelay/config.yaml and edit.

camera:
  # Leave empty to auto-detect, or set explicitly:
  #   "usb:"                 — pick the first USB PTP camera
  #   "ptpip:192.168.1.1"    — PTP-over-IP at the given address
  port: ""
  prefer_ptpip_host: "192.168.1.1"
  allow_usb: true
  poll_interval_sec: 5
  delete_after_upload: false
  include_ext: [jpg, jpeg, nef, mp4, mov]

nas:
  # Option A: rclone remote (recommended).
  # Setup with `rclone config` first (e.g. add 'nas' pointing to your SMB share).
  # Examples:
  #   rclone_remote: "nas:photos"
  #   rclone_remote: "my-sftp:~/photos/cam"
  rclone_remote: ""
  rclone_subdir: "/CamRelay"
  # Option B: direct copy to an already-mounted path.
  # e.g. /etc/fstab: //nas.local/photos /mnt/nas cifs credentials=/etc/nas.cred
  direct_path: ""
  # rclone bandwidth limit. "10M" = 10 MB/s. Empty = unlimited.
  bandwidth_limit: ""

web:
  host: "0.0.0.0"
  port: 8080
  # Set a password to protect the web UI (HTTP basic via X-CamRelay-Password header).
  # Leave empty for no auth (LAN only!).
  password: ""

staging_dir: "/var/lib/camrelay/staging"
state_db: "/var/lib/camrelay/state.json"
log_level: "INFO"
